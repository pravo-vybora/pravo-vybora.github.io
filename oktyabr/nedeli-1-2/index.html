<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{

}

  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1519; --surface:#172027; --ink:#E6ECF0; --muted:#9AA7B2; --line:#2A353E;
    --accent:#6EC1CF; --accent-soft:#16323A;

    --l-ohvat-bg:#16323A; --l-doverie-bg:#23294A; --l-zayavka-bg:#3A2D17;

}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1519; --surface:#172027; --ink:#E6ECF0; --muted:#9AA7B2; --line:#2A353E;
  --accent:#6EC1CF; --accent-soft:#16323A;
  --l-ohvat:#6EC1CF; --l-doverie:#A6B1F0; --l-zayavka:#E3B36A;
  --l-ohvat-bg:#16323A; --l-doverie-bg:#23294A; --l-zayavka-bg:#3A2D17;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.sub{color:var(--muted);margin:6px 0 0}

.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px;letter-spacing:.04em;text-transform:uppercase}

.day.empty{background:transparent}
.day .n{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.day.pending .n{color:var(--muted)}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:3px 5px;font:500 11.5px/1.25 "Onest",system-ui,sans-serif;cursor:pointer;color:var(--c);background:var(--cbg);overflow-wrap:anywhere}
.chip:hover,.chip:focus-visible{outline:2px solid var(--c);outline-offset:1px}

.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:12px}
details.card{border:1px solid var(--line);border-radius:8px;background:var(--bg);scroll-margin-top:80px}

.date{font:700 15px/1.2 "Unbounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--c);min-width:52px}
.date small{display:block;font:500 12px "Onest",system-ui,sans-serif;color:var(--muted)}
.ttl{font-weight:700;font-size:17px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.tag{color:var(--c);font-weight:500}
.chev{width:22px;height:22px;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:18px;max-width:72ch}
.hook{background:#111A20;color:#fff;border-radius:6px;padding:16px 14px;text-align:center;font:700 clamp(17px,3.6vw,22px)/1.2 "Unbounded",system-ui,sans-serif;letter-spacing:.01em}
.hook i{font:600 1.15em/1 "Caveat",cursive;font-style:normal;color:#F2E6C8;padding-inline:.2em;letter-spacing:0}
.sec h3{margin:0 0 6px;font:700 12px/1.3 "Onest",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec p{margin:0}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:14px;border-left:2px solid var(--line)}
.act{color:var(--ink)}
.rep{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.rep div{background:var(--surface);border-radius:6px;padding:6px 10px}
.rep b{color:var(--c);font-weight:700}
.screen{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.cover{font:700 16px/1.3 "Unbounded",system-ui,sans-serif;text-transform:uppercase}
.law{font-size:13.5px;color:var(--muted)}
.box{background:var(--surface);border-radius:8px;padding:14px 16px}
.speech .line{margin:0 0 10px;line-height:1.55}
.speech .line:last-child{margin-bottom:0}
.speech b{color:var(--c)}
.act{color:var(--muted);font-style:normal}
.line.solo .act{color:var(--muted)}
.extra{font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.extra .screen{color:var(--muted)}
.sub2{margin:6px 0 0;font-weight:700;font-size:13px;color:var(--ink)}
.soon{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
